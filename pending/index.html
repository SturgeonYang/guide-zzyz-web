<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>帖子搜索 · 求学指南酱</title>
    <style>
        /* ============================================================
           设计变量 —— 与当前项目（src/styles/globals.css）保持一致
           ============================================================ */
        :root {
            --color-primary: #0067D1;
            --color-primary-dark: #0052a8;
            --color-primary-light: #cfebff;   /* card-accent */
            --color-bg: #F5F5F5;
            --color-card: #FFFFFF;
            --color-text: #000000;
            --color-text-secondary: #48556a;
            --color-text-muted: #A8A8A8;
            --color-border: #e5e7eb;
            --color-footer: #2c3e50;
            --radius: 12px;
            --radius-lg: 16px;
            --transition: 0.2s ease;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font);
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ============================================================
           导航栏 —— 参考 src/components/Navbar.tsx
           ============================================================ */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 50;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(229, 231, 235, 0.5);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }

        .nav-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 16px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        @media (min-width: 1024px) {
            .nav-inner { height: 80px; padding: 0 40px; }
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .nav-logo {
            width: 40px; height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .nav-brand-name {
            font-size: 20px;
            font-weight: 800;
            color: var(--color-text);
            white-space: nowrap;
            letter-spacing: -0.01em;
        }

        @media (min-width: 1024px) {
            .nav-brand-name { font-size: 24px; }
        }

        .nav-links {
            display: none;
            align-items: center;
        }

        @media (min-width: 768px) {
            .nav-links { display: flex; }
        }

        .nav-link {
            position: relative;
            padding: 10px 18px;
            font-size: 18px;
            font-weight: 600;
            color: var(--color-text-muted);
            text-decoration: none;
            transition: color var(--transition);
        }

        .nav-link:last-child { padding-right: 0; }

        .nav-link:hover { color: var(--color-primary); }

        .nav-link.active { color: var(--color-primary); }

        .nav-link.active::after {
            content: '';
            position: absolute;
            left: 18px; right: 18px; bottom: 2px;
            height: 4px;
            border-radius: 999px;
            background: var(--color-primary);
        }

        .nav-link:last-child.active::after { right: -4px; }

        .nav-auth {
            display: none;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
        }

        @media (min-width: 768px) {
            .nav-auth { display: flex; }
        }

        .nav-auth a {
            color: var(--color-text-muted);
            text-decoration: none;
            padding: 8px 12px;
            transition: color var(--transition);
        }

        .nav-auth a:hover { color: var(--color-primary); }

        /* 移动端菜单按钮 */
        .nav-burger {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px; height: 40px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--color-text);
        }

        @media (min-width: 768px) {
            .nav-burger { display: none; }
        }

        .nav-burger svg { width: 26px; height: 26px; }

        /* 移动端下拉菜单 */
        .nav-mobile {
            display: none;
            flex-direction: column;
            border-top: 1px solid rgba(78, 80, 82, 0.34);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.92);
        }

        .nav-mobile.open { display: flex; }

        .nav-mobile a {
            display: block;
            text-align: center;
            padding: 14px 24px;
            font-size: 18px;
            font-weight: 700;
            color: var(--color-text);
            text-decoration: none;
            transition: color var(--transition);
        }

        .nav-mobile a:hover,
        .nav-mobile a.active { color: var(--color-primary); }

        /* ============================================================
           页面主体 —— 参考 src/pages/Community.tsx
           ============================================================ */
        .page {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
            padding: 140px 16px 80px;
            /* 背景：品牌蓝顶部渐晕 + 柔和光斑，避免纯灰单调 */
            background-color: var(--color-bg);
            background-image:
                radial-gradient(720px 460px at 88% -60px, rgba(0, 103, 209, 0.12), transparent 65%),
                radial-gradient(620px 420px at 2% 140px, rgba(0, 103, 209, 0.08), transparent 60%),
                linear-gradient(180deg, #eaf3ff 0%, var(--color-bg) 460px);
        }

        /* 装饰光斑 */
        .page-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(72px);
            pointer-events: none;
        }

        .blob-1 {
            width: 460px; height: 460px;
            top: -160px; right: -120px;
            background: radial-gradient(circle, rgba(0, 103, 209, 0.20) 0%, transparent 68%);
        }

        .blob-2 {
            width: 380px; height: 380px;
            top: 140px; left: -150px;
            background: radial-gradient(circle, rgba(207, 235, 255, 0.9) 0%, transparent 66%);
        }

        .blob-3 {
            width: 320px; height: 320px;
            top: 430px; right: -100px;
            background: radial-gradient(circle, rgba(207, 235, 255, 0.7) 0%, transparent 66%);
        }

        @media (min-width: 640px) {
            .page { padding-left: 24px; padding-right: 24px; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1024px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--color-text);
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .page-header p {
            font-size: 1.125rem;
            color: #707070;
        }

        @media (min-width: 1024px) {
            .page-header h1 { font-size: 3.75rem; }
        }

        /* ============================================================
           搜索栏
           ============================================================ */
        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: 999px;
            padding: 6px 8px 6px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 20px;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .search-box:focus-within {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(0, 103, 209, 0.12);
        }

        .search-box svg { width: 20px; height: 20px; color: var(--color-text-muted); flex-shrink: 0; }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font: inherit;
            font-size: 15px;
            color: var(--color-text);
            background: transparent;
            min-width: 0;
        }

        .search-box input::placeholder { color: var(--color-text-muted); }

        .search-clear {
            flex-shrink: 0;
            border: none;
            background: var(--color-bg);
            color: var(--color-text-secondary);
            font-size: 13px;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 999px;
            cursor: pointer;
            transition: all var(--transition);
        }

        .search-clear:hover {
            background: var(--color-primary-light);
            color: var(--color-primary);
        }

        /* ============================================================
           筛选面板
           ============================================================ */
        .filter-card {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 20px 24px;
            margin-bottom: 24px;
        }

        .filter-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .filter-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--color-text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-actions {
            display: flex;
            gap: 8px;
        }

        .btn-ghost {
            border: 1px solid var(--color-border);
            background: var(--color-card);
            color: var(--color-text-secondary);
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: all var(--transition);
        }

        .btn-ghost:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
            background: var(--color-primary-light);
        }

        .tag-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            background: var(--color-card);
            color: var(--color-text-secondary);
            border: 1px solid var(--color-border);
            cursor: pointer;
            user-select: none;
            transition: all var(--transition);
        }

        .tag-chip:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
            background: var(--color-primary-light);
        }

        .tag-chip.active {
            background: var(--color-primary);
            color: #fff;
            border-color: var(--color-primary);
            box-shadow: 0 4px 12px rgba(0, 103, 209, 0.25);
        }

        .tag-chip .count {
            font-size: 12px;
            font-weight: 400;
            opacity: 0.7;
        }

        /* ============================================================
           工具栏（计数 + 排序）
           ============================================================ */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 20px;
        }

        .toolbar-stats {
            font-size: 14px;
            color: var(--color-text-secondary);
        }

        .toolbar-stats strong { color: var(--color-text); font-weight: 700; }

        .toolbar-hint {
            margin-left: 8px;
            font-size: 13px;
            color: var(--color-primary);
        }

        .sort-group {
            display: flex;
            gap: 4px;
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: 999px;
            padding: 4px;
        }

        .sort-btn {
            padding: 6px 16px;
            border: none;
            border-radius: 999px;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: var(--color-text-secondary);
            transition: all var(--transition);
        }

        .sort-btn:hover { color: var(--color-text); }

        .sort-btn.active {
            background: var(--color-primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(0, 103, 209, 0.2);
        }

        /* ============================================================
           帖子列表 —— 参考 src/community/posts/PostList.tsx
           ============================================================ */
        .post-list { display: flex; flex-direction: column; gap: 16px; }

        .post-card {
            display: block;
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 20px 24px;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: box-shadow var(--transition), transform var(--transition), border-color var(--transition);
        }

        .post-card:hover {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
            border-color: var(--color-primary-light);
        }

        .post-header {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px 16px;
            margin-bottom: 10px;
        }

        .post-title {
            font-size: 17px;
            font-weight: 600;
            color: #2c3e50;
            line-height: 1.5;
            transition: color var(--transition);
        }

        .post-card:hover .post-title { color: var(--color-primary); }

        .post-author {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--color-text-muted);
            white-space: nowrap;
        }

        .post-author svg { width: 14px; height: 14px; flex-shrink: 0; }

        .post-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }

        .post-tag {
            padding: 2px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            background: var(--color-primary-light);
            color: var(--color-primary);
            border: 1px solid transparent;
            transition: all var(--transition);
        }

        .post-tag:hover {
            background: #fff;
            border-color: var(--color-primary);
        }

        .post-excerpt {
            font-size: 14px;
            color: var(--color-text-secondary);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .post-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--color-border);
        }

        .post-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: var(--color-text-muted);
        }

        .post-meta span { display: inline-flex; align-items: center; gap: 4px; }

        .post-meta svg { width: 15px; height: 15px; }

        .post-readmore {
            font-size: 13px;
            font-weight: 600;
            color: var(--color-primary);
            transition: color var(--transition);
        }

        .post-card:hover .post-readmore { color: var(--color-primary-dark); }

        /* ============================================================
           空状态
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 64px 20px;
            color: var(--color-text-secondary);
        }

        .empty-state .empty-icon {
            width: 72px; height: 72px;
            margin: 0 auto 16px;
            border-radius: 999px;
            background: var(--color-primary-light);
            color: var(--color-primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-icon svg { width: 34px; height: 34px; }

        .empty-state h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 4px;
        }

        .empty-state p { font-size: 15px; }

        .empty-state .btn-reset {
            margin-top: 18px;
            border: 1px solid var(--color-primary);
            background: var(--color-primary);
            color: #fff;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            padding: 9px 22px;
            border-radius: 999px;
            cursor: pointer;
            transition: all var(--transition);
        }

        .empty-state .btn-reset:hover { background: var(--color-primary-dark); }

        /* ============================================================
           页脚 —— 参考 src/components/Footer.tsx
           ============================================================ */
        .footer {
            background: var(--color-footer);
            border-top: 1px solid #34495e;
        }

        .footer-inner {
            max-width: 1024px;
            margin: 0 auto;
            padding: 40px 16px;
        }

        .footer-cols {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-wrap: wrap;
            gap: 32px;
            margin-bottom: 24px;
            text-align: center;
        }

        @media (min-width: 768px) {
            .footer-cols {
                flex-direction: row;
                justify-content: space-between;
                align-items: flex-start;
                text-align: left;
            }
        }

        .footer-col h3 {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 12px;
        }

        .footer-col ul { list-style: none; }

        .footer-col li {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            padding: 4px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .footer-col li svg { width: 14px; height: 14px; flex-shrink: 0; }

        @media (min-width: 768px) {
            .footer-col li { justify-content: flex-start; }
        }

        .footer-col li a {
            color: inherit;
            text-decoration: none;
            transition: color var(--transition);
        }

        .footer-col li a:hover { color: #fff; }

        .footer-copy {
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .footer-copy p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ===== 导航栏 ===== -->
    <nav class="navbar">
        <div class="nav-inner">
            <a class="nav-brand" href="#">
                <span class="nav-logo">酱</span>
                <span class="nav-brand-name">求学指南酱</span>
            </a>

            <div class="nav-links">
                <a class="nav-link" href="#">首页</a>
                <a class="nav-link" href="#">投稿</a>
                <a class="nav-link active" href="#">帖子</a>
                <a class="nav-link" href="#">加入我们</a>
            </div>

            <div class="nav-auth">
                <a href="#">登录</a>
                <a href="#">注册</a>
            </div>

            <button class="nav-burger" id="burgerBtn" aria-label="打开菜单" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- 移动端菜单 -->
        <div class="nav-mobile" id="mobileMenu">
            <a href="#">首页</a>
            <a href="#">投稿</a>
            <a href="#" class="active">帖子</a>
            <a href="#">加入我们</a>
            <a href="#">登录 / 注册</a>
        </div>
    </nav>

    <!-- ===== 页面主体 ===== -->
    <main class="page">
        <!-- 装饰背景 -->
        <div class="page-bg" aria-hidden="true">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>

        <div class="container">

            <!-- 页头 -->
            <header class="page-header">
                <h1>帖子搜索</h1>
                <p>按标签筛选，浏览已发布的求学指南</p>
            </header>

            <!-- 搜索框 -->
            <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="搜索帖子标题或作者…" autocomplete="off" />
                <button class="search-clear" id="searchClearBtn" type="button">清空</button>
            </div>

            <!-- 筛选面板 -->
            <section class="filter-card">
                <div class="filter-head">
                    <span class="filter-title">按标签筛选</span>
                    <div class="filter-actions">
                        <button class="btn-ghost" id="selectAllBtn" type="button">全部选择</button>
                        <button class="btn-ghost" id="clearAllBtn" type="button">清空</button>
                    </div>
                </div>
                <div class="tag-grid" id="tagGrid">
                    <!-- 由 JS 渲染 -->
                </div>
            </section>

            <!-- 工具栏 -->
            <div class="toolbar">
                <div class="toolbar-stats">
                    共 <strong id="postCount">0</strong> 篇帖子
                    <span class="toolbar-hint hidden" id="filterHint"></span>
                </div>
                <div class="sort-group" role="group" aria-label="排序方式">
                    <button class="sort-btn active" id="sortTimeBtn" type="button">时间</button>
                    <button class="sort-btn" id="sortViewsBtn" type="button">点击量</button>
                </div>
            </div>

            <!-- 帖子列表 -->
            <div class="post-list" id="postList"></div>

            <!-- 空状态 -->
            <div class="empty-state hidden" id="emptyState">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="8" x2="14" y2="14"/><line x1="14" y1="8" x2="8" y2="14"/></svg>
                </div>
                <h3>没有找到匹配的帖子</h3>
                <p>试试调整关键词或清除标签筛选</p>
                <button class="btn-reset" id="resetBtn" type="button">重置全部条件</button>
            </div>

        </div>
    </main>

    <script>
        // ============================================================
        //  1. 模拟数据 —— 数据结构对齐第一阶段接口 GET /api/posts
        //     { id, title, author, tags, create_time, view_count, visit_path }
        // ============================================================
        const POSTS = [
            {
                id: 10,
                title: '高三数学一轮复习避坑指南',
                author: '张三',
                tags: ['学习', '数学', '高三'],

                visit_path: '/posts/open/10',
                excerpt: '从知识点框架到刷题策略，分享我踩过的 5 个坑和 3 个高效提分技巧。',
            },
            {
                id: 11,
                title: '如何选择大学专业？过来人的 4 条建议',
                author: '李四',
                tags: ['大学', '专业选择', '生涯规划'],
                create_time: '2026-07-26T09:15:00',
                view_count: 1932,
                visit_path: '/posts/open/11',
                excerpt: '不要只看就业率！从兴趣、能力、城市、行业前景四个维度帮你理清思路。',
            },
            {
                id: 12,
                title: '高中住校生存手册 · 生活篇',
                author: '王五',
                tags: ['生活', '住校', '高中'],
                create_time: '2026-07-24T20:00:00',
                view_count: 1567,
                visit_path: '/posts/open/12',
                excerpt: '作息、饮食、人际关系、卫生习惯…… 住校三年的真实经验，让你的高中生活更从容。',
            },
            {
                id: 13,
                title: '英语完形填空满分套路（附真题解析）',
                author: '张三',
                tags: ['学习', '英语', '高考'],
                create_time: '2026-07-22T11:45:00',
                view_count: 3421,
                visit_path: '/posts/open/13',
                excerpt: '完形填空不只是考词汇，更考逻辑。掌握这 6 个信号词，正确率提升 30%+。',
            },
            {
                id: 14,
                title: '大学社团值得参加吗？学长学姐真实体验',
                author: '李四',
                tags: ['大学', '社团', '生活'],
                create_time: '2026-07-20T16:20:00',
                view_count: 876,
                visit_path: '/posts/open/14',
                excerpt: '学生会、兴趣社团、志愿者…… 哪些值得投入？哪些是“坑”？一次讲清楚。',
            },
            {
                id: 15,
                title: '心态崩了怎么办？考前焦虑急救包',
                author: '赵六',
                tags: ['生活', '心理', '高三'],
                create_time: '2026-07-18T13:00:00',
                view_count: 2103,
                visit_path: '/posts/open/15',
                excerpt: '从呼吸法到认知重构，5 个可立刻操作的方法，帮你稳住心态，正常发挥。',
            },
            {
                id: 16,
                title: '物理压轴题突破：从 20 分到 60 分的蜕变',
                author: '王五',
                tags: ['学习', '物理', '高三'],
                create_time: '2026-07-16T08:30:00',
                view_count: 1124,
                visit_path: '/posts/open/16',
                excerpt: '拆解压轴题的底层逻辑，用“模型思维”把复杂问题简单化。',
            },
            {
                id: 17,
                title: '大学四年时间线：每个阶段该做什么？',
                author: '赵六',
                tags: ['大学', '生涯规划', '时间管理'],
                create_time: '2026-07-14T19:10:00',
                view_count: 2568,
                visit_path: '/posts/open/17',
                excerpt: '大一探索、大二深耕、大三实习、大四冲刺——一份清晰的时间规划参考。',
            },
        ];

        // 提取所有标签（去重排序）
        const ALL_TAGS = [...new Set(POSTS.flatMap(p => p.tags))].sort();

        // ============================================================
        //  2. 状态
        // ============================================================
        const state = {
            selectedTags: [],
            sortBy: 'time',          // 'time' | 'views'
            keyword: '',
            results: [...POSTS],
        };

        // ============================================================
        //  3. DOM 引用
        // ============================================================
        const $ = s => document.querySelector(s);

        const tagGrid = $('#tagGrid');
        const postList = $('#postList');
        const emptyState = $('#emptyState');
        const postCount = $('#postCount');
        const filterHint = $('#filterHint');
        const searchInput = $('#searchInput');
        const searchClearBtn = $('#searchClearBtn');
        const selectAllBtn = $('#selectAllBtn');
        const clearAllBtn = $('#clearAllBtn');
        const sortTimeBtn = $('#sortTimeBtn');
        const sortViewsBtn = $('#sortViewsBtn');
        const resetBtn = $('#resetBtn');
        const burgerBtn = $('#burgerBtn');
        const mobileMenu = $('#mobileMenu');

        // ============================================================
        //  4. 工具函数
        // ============================================================
        function formatTime(iso) {
            const d = new Date(iso);
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const h = String(d.getHours()).padStart(2, '0');
            const min = String(d.getMinutes()).padStart(2, '0');
            return `${m}/${day} ${h}:${min}`;
        }

        function formatViews(n) {
            if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
            return String(n);
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // ============================================================
        //  5. 渲染
        // ============================================================

        // 5.1 标签
        function renderTags() {
            const counts = {};
            POSTS.forEach(p => p.tags.forEach(t => { counts[t] = (counts[t] || 0) + 1; }));

            tagGrid.innerHTML = ALL_TAGS.map(tag => {
                const active = state.selectedTags.includes(tag) ? 'active' : '';
                return `<span class="tag-chip ${active}" data-tag="${escapeHtml(tag)}">
                            ${escapeHtml(tag)} <span class="count">${counts[tag]}</span>
                        </span>`;
            }).join('');

            tagGrid.querySelectorAll('.tag-chip').forEach(el => {
                el.addEventListener('click', () => toggleTag(el.dataset.tag));
            });
        }

        // 5.2 帖子列表
        function renderPosts() {
            const posts = state.results;

            if (posts.length === 0) {
                postList.innerHTML = '';
                emptyState.classList.remove('hidden');
                postCount.textContent = '0';
                filterHint.textContent = '';
                filterHint.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            const sorted = [...posts];
            if (state.sortBy === 'time') {
                sorted.sort((a, b) => new Date(b.create_time) - new Date(a.create_time));
            } else {
                sorted.sort((a, b) => b.view_count - a.view_count);
            }

            postList.innerHTML = sorted.map(p => `
                <a class="post-card" href="${p.visit_path}" data-id="${p.id}">
                    <div class="post-header">
                        <span class="post-title">${escapeHtml(p.title)}</span>
                        <span class="post-author">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            ${escapeHtml(p.author || '佚名')}
                        </span>
                    </div>
                    <div class="post-tags">
                        ${p.tags.map(t => `<span class="post-tag">${escapeHtml(t)}</span>`).join('')}
                    </div>
                    <div class="post-excerpt">${escapeHtml(p.excerpt || '')}</div>
                    <div class="post-footer">
                        <div class="post-meta">
                            <span>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                ${formatTime(p.create_time)}
                            </span>
                            <span>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                ${formatViews(p.view_count)}
                            </span>
                        </div>
                        <span class="post-readmore">点击查看详情 →</span>
                    </div>
                </a>
            `).join('');

            postCount.textContent = sorted.length;

            if (state.selectedTags.length > 0) {
                filterHint.textContent = `（已筛选：${state.selectedTags.join('、')}）`;
                filterHint.classList.remove('hidden');
            } else {
                filterHint.textContent = '';
                filterHint.classList.add('hidden');
            }
        }

        // 5.3 核心过滤
        function applyFilter() {
            let results = POSTS;

            // 关键词（标题 / 作者）
            const kw = state.keyword.trim().toLowerCase();
            if (kw) {
                results = results.filter(p =>
                    p.title.toLowerCase().includes(kw) ||
                    (p.author && p.author.toLowerCase().includes(kw))
                );
            }

            // 标签（任一匹配）
            if (state.selectedTags.length > 0) {
                results = results.filter(p =>
                    state.selectedTags.some(tag => p.tags.includes(tag))
                );
            }

            state.results = results;
            renderPosts();
            renderTags();
        }

        // ============================================================
        //  6. 交互
        // ============================================================
        function toggleTag(tag) {
            const idx = state.selectedTags.indexOf(tag);
            if (idx > -1) state.selectedTags.splice(idx, 1);
            else state.selectedTags.push(tag);
            applyFilter();
        }

        function setSortBy(sort) {
            if (state.sortBy === sort) return;
            state.sortBy = sort;
            sortTimeBtn.classList.toggle('active', sort === 'time');
            sortViewsBtn.classList.toggle('active', sort === 'views');
            renderPosts();
        }

        function resetAll() {
            state.selectedTags = [];
            state.sortBy = 'time';
            state.keyword = '';
            searchInput.value = '';
            sortTimeBtn.classList.add('active');
            sortViewsBtn.classList.remove('active');
            applyFilter();
        }

        // ============================================================
        //  7. 事件绑定
        // ============================================================
        searchInput.addEventListener('input', () => {
            state.keyword = searchInput.value;
            applyFilter();
        });

        searchClearBtn.addEventListener('click', () => {
            searchInput.value = '';
            state.keyword = '';
            applyFilter();
        });

        selectAllBtn.addEventListener('click', () => {
            state.selectedTags = [...ALL_TAGS];
            applyFilter();
        });

        clearAllBtn.addEventListener('click', () => {
            state.selectedTags = [];
            applyFilter();
        });

        sortTimeBtn.addEventListener('click', () => setSortBy('time'));
        sortViewsBtn.addEventListener('click', () => setSortBy('views'));
        resetBtn.addEventListener('click', resetAll);

        // 移动端菜单
        burgerBtn.addEventListener('click', () => {
            const open = mobileMenu.classList.toggle('open');
            burgerBtn.setAttribute('aria-expanded', String(open));
        });

        // 点击帖子卡片上的标签 → 加入筛选（事件委托）
        postList.addEventListener('click', (e) => {
            const tagEl = e.target.closest('.post-tag');
            if (tagEl) {
                e.preventDefault();
                const tag = tagEl.textContent.trim();
                if (!state.selectedTags.includes(tag)) {
                    state.selectedTags.push(tag);
                    applyFilter();
                } else {
                    toggleTag(tag);
                }
            }
        });

        // 点击阅读 → 记录模拟点击量（演示阶段 view_count +1）
        postList.addEventListener('click', (e) => {
            const card = e.target.closest('.post-card');
            if (!card || e.target.closest('.post-tag')) return;
            e.preventDefault();
            const post = POSTS.find(p => p.id === Number(card.dataset.id));
            if (post) {
                post.view_count += 1;
                applyFilter();
            }
            console.log(`阅读: ${card.querySelector('.post-title').textContent} → ${card.getAttribute('href')}`);
        });

        // ============================================================
        //  8. 初始化
        // ============================================================
        resetAll();
        console.log('求学指南酱 · 帖子搜索（第一阶段原型）');
    </script>
